<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <title>Kindle渲染诊断</title>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
    <meta name="viewport" content="width=320, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <link rel="stylesheet" type="text/css" href="vendor/weathericons/css/weather-icons.css" />
    <style type="text/css">
      @font-face {
        font-family: PuHuiTi;
        src: url("css/PuHuiTiMin.ttf?v=20261103-weather");
      }
      html, body { margin: 0; padding: 0; background: #ffffff; color: #000000; }
      body { font-family: sans-serif; }
      #nav { font-size: 3rem; padding: 1rem 2rem; border-bottom: 2px solid #000000; }
      #nav a { color: #000000; margin-right: 3rem; }
      #nav a.on { font-weight: bold; text-decoration: none; border-bottom: 4px solid #000000; }
      #status { font-size: 2.2rem; padding: 0.5rem 2rem; }
      .test { position: relative; border-bottom: 1px solid #000000; padding: 0.5rem 2rem; overflow: hidden; }
      /* Labels stay in the system font so they can still be read when a web font fails. */
      .label { font-family: sans-serif; font-size: 2.2rem; line-height: 3rem; }
      .label b { margin-right: 1rem; }
      .puhui { font-family: PuHuiTi; }
      .system { font-family: sans-serif; }
      .nowrap { white-space: nowrap; }
      .icons i, .icons img { margin-right: 2rem; vertical-align: middle; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="nav">
      <a id="nav-clock" href="?t=clock">字号</a>
      <a id="nav-icons" href="?t=icons">图标</a>
      <a id="nav-text" href="?t=text">文字</a>
    </div>
    <div id="status">加载中…</div>

    <!-- 字号：同样的数字，换字体、换字号 -->
    <div id="group-clock" class="hidden">
      <div class="test">
        <div class="label"><b>A1</b>普惠体 28rem（与主页时钟相同）</div>
        <div class="puhui nowrap dyn-clock" style="font-size:28rem;line-height:28rem;"></div>
      </div>
      <div class="test">
        <div class="label"><b>A2</b>系统字体 28rem</div>
        <div class="system nowrap dyn-clock" style="font-size:28rem;line-height:28rem;"></div>
      </div>
      <div class="test">
        <div class="label"><b>A3</b>普惠体 14rem</div>
        <div class="puhui nowrap dyn-clock" style="font-size:14rem;line-height:14rem;"></div>
      </div>
      <div class="test">
        <div class="label"><b>A4</b>普惠体 7rem，全部数字</div>
        <div class="puhui nowrap dyn-digits" style="font-size:7rem;"></div>
      </div>
    </div>

    <!-- 图标：字体图标 vs PNG 图片 -->
    <div id="group-icons" class="hidden">
      <div class="test icons">
        <div class="label"><b>B1</b>字体图标 9rem（与主页当前天气相同）</div>
        <div class="dyn-icons" style="font-size:9rem;"></div>
      </div>
      <div class="test icons">
        <div class="label"><b>B2</b>字体图标 6rem（与主页预报相同）</div>
        <div class="dyn-icons" style="font-size:6rem;"></div>
      </div>
      <div class="test icons">
        <div class="label"><b>B3</b>PNG 图片 12rem</div>
        <div class="dyn-images" data-size="12"></div>
      </div>
      <div class="test icons">
        <div class="label"><b>B4</b>PNG 图片 8rem</div>
        <div class="dyn-images" data-size="8"></div>
      </div>
    </div>

    <!-- 文字：中文、日期 -->
    <div id="group-text" class="hidden">
      <div class="test">
        <div class="label"><b>C1</b>普惠体 7rem 日期</div>
        <div class="puhui nowrap dyn-date" style="font-size:7rem;"></div>
      </div>
      <div class="test">
        <div class="label"><b>C2</b>系统字体 7rem 日期</div>
        <div class="system nowrap dyn-date" style="font-size:7rem;"></div>
      </div>
      <div class="test">
        <div class="label"><b>C3</b>普惠体 5rem 中文（与主页预报相同）</div>
        <div class="puhui dyn-words" style="font-size:5rem;"></div>
      </div>
      <div class="test">
        <div class="label"><b>C4</b>系统字体 5rem 中文</div>
        <div class="system dyn-words" style="font-size:5rem;"></div>
      </div>
    </div>

    <script type="text/javascript">
      // ES5 only. Rewrites every dynamic cell every 15 seconds, like the main page did.
      (function () {
        var icons = [
          { cls: "wi wi-day-sunny", img: "sunny" },
          { cls: "wi wi-cloudy", img: "cloudy" },
          { cls: "wi wi-rain", img: "rain" },
          { cls: "wi wi-snow", img: "snow" },
          { cls: "wi wi-night-clear", img: "night" }
        ];
        var words = ["多云", "晴", "小雨", "阴", "中雪", "雷阵雨", "薄雾", "碎云"];
        var tick = 0;
        var started = new Date();

        function param(name) {
          var match = new RegExp("[?&]" + name + "=([^&#]*)").exec(location.search);
          return match ? decodeURIComponent(match[1]) : null;
        }

        function pad(n) { return n < 10 ? "0" + n : String(n); }

        function byClass(name) {
          if (document.getElementsByClassName) return document.getElementsByClassName(name);
          return document.querySelectorAll("." + name);
        }

        function fill(name, html) {
          var list = byClass(name);
          for (var i = 0; i < list.length; i++) list[i].innerHTML = html;
        }

        function rotate(list, by) {
          var out = [];
          for (var i = 0; i < list.length; i++) out.push(list[(i + by) % list.length]);
          return out;
        }

        function render() {
          var now = new Date();
          tick++;
          fill("dyn-clock", pad(now.getHours()) + ":" + pad(now.getMinutes()));
          var digits = "0123456789";
          var shift = tick % 10;
          fill("dyn-digits", digits.slice(shift) + digits.slice(0, shift));
          fill("dyn-date", String(now.getFullYear()).slice(2) + "-" + pad(now.getMonth() + 1) + "-" +
            pad(now.getDate()) + " " + pad(now.getHours()) + ":" + pad(now.getMinutes()));

          var order = rotate(icons, tick % icons.length);
          var iconHtml = "";
          for (var i = 0; i < order.length; i++) iconHtml += "<i class='" + order[i].cls + "'></i>";
          fill("dyn-icons", iconHtml);
          var imageCells = byClass("dyn-images");
          for (var c = 0; c < imageCells.length; c++) {
            var size = imageCells[c].getAttribute("data-size");
            var imgHtml = "";
            for (var j = 0; j < order.length; j++) {
              imgHtml += "<img src='diag/" + order[j].img + ".png' alt='" + order[j].img +
                "' style='width:" + size + "rem;height:" + size + "rem;' />";
            }
            imageCells[c].innerHTML = imgHtml;
          }

          fill("dyn-words", rotate(words, tick % words.length).join(" ") + " " + (tick % 40 - 10) + "℃");

          document.getElementById("status").innerHTML = "第 " + tick + " 次刷新 · " +
            pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds()) +
            " · 已运行 " + Math.round((now.getTime() - started.getTime()) / 60000) + " 分钟";
        }

        function setRem() {
          var h = window.innerHeight || document.documentElement.clientHeight;
          document.documentElement.style.fontSize = h / 100 + "px";
        }

        window.addEventListener("load", function () {
          var group = param("t");
          if (group !== "icons" && group !== "text") group = "clock";
          document.getElementById("group-" + group).className = "";
          document.getElementById("nav-" + group).className = "on";
          setRem();
          render();
          window.setInterval(render, 15 * 1000);
        });
        window.addEventListener("resize", setRem);
      })();
    </script>
  </body>
</html>
